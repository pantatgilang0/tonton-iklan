<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NONTON CUAN - ANTI BLACKOUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; margin: 0; cursor: pointer; }
        .yt-frame { background: #111; border-radius: 12px; position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; border: 1px solid #333; display: flex; align-items: center; justify-content: center; }
        .progress-fill { height: 100%; background: #ff0000; width: 0%; transition: width 1s linear; }
        .ad-container { display: flex; flex-direction: column; align-items: center; gap: 20px; padding-bottom: 80px; }
        .ad-slot { background: #111; border: 1px solid #222; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 50px; }
        iframe { border: none; }
        .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(10,10,10,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid #222; }
    </style>
</head>
<body onclick="openSmartlink()">

    <div class="sticky-header p-4 flex justify-between items-center w-full">
        <div>
            <p class="text-[10px] font-bold text-slate-500 uppercase">Total Cuan</p>
            <h1 class="text-2xl font-black text-green-400">Rp <span id="saldo">11.900</span></h1>
        </div>
        <div class="flex flex-col items-end gap-1">
            <button onclick="event.stopPropagation(); window.location.reload();" class="bg-blue-600 text-white text-[8px] font-bold px-3 py-1 rounded mb-1">FIX BLACK SCREEN</button>
            <button onclick="event.stopPropagation(); requestWD()" class="bg-white text-black text-[10px] font-black px-4 py-1.5 rounded-full uppercase">Withdraw</button>
        </div>
    </div>

    <div class="p-4 ad-container">
        <div class="w-full max-w-lg">
            <div class="yt-frame shadow-2xl mb-2" id="ad-main-container">
                <span class="text-[10px] text-gray-700">Loading Adzilla...</span>
            </div>
            <div class="h-1 bg-gray-800 rounded-full overflow-hidden w-full">
                <div id="p-fill" class="progress-fill"></div>
            </div>
            <p class="text-center text-[9px] text-slate-500 mt-2" id="status-text">Memulai siklus anti-blokir...</p>
        </div>

        <div class="ad-slot" style="width: 300px; height: 250px;" id="slot-1"></div>
        <div class="ad-slot" style="width: 468px; height: 60px;" id="slot-2"></div>
        <div class="ad-slot" style="width: 160px; height: 300px;" id="slot-3"></div>
        <div class="ad-slot" style="width: 160px; height: 600px;" id="slot-4"></div>
        <div class="ad-slot" style="width: 728px; height: 90px;" id="slot-5"></div>
    </div>

    <script>
        let saldo = parseInt(localStorage.getItem('app_saldo')) || 11900;
        const smartlinkUrl = "https://www.effectivegatecpm.com/ypk79fz44e?key=086401ebd705ad471cfebf22fb4f94f4";
        const socialBarScript = "https://pl28606612.effectivegatecpm.com/59/b3/e8/59b3e86754e4943e8fe6f30131f537e7.js";

        function openSmartlink() { window.open(smartlinkUrl, '_blank'); }

        // Fungsi khusus untuk bypass proteksi Adsterra
        function loadAd(containerId, key, w, h) {
            const container = document.getElementById(containerId);
            container.innerHTML = ''; // Clear previous
            const ifr = document.createElement('iframe');
            ifr.width = w;
            ifr.height = h;
            // Gunakan blob atau srcdoc untuk menghindari deteksi iframe standar
            ifr.srcdoc = `<html><body style="margin:0;display:flex;justify-content:center;align-items:center;background:transparent;">
                <script>atOptions={'key':'${key}','format':'iframe','height':${h},'width':${w},'params':{}};\x3C/script>
                <script src="https://www.highperformanceformat.com/${key}/invoke.js"><\/script>
            </body></html>`;
            container.appendChild(ifr);
        }

        function refreshAll() {
            // Main Ad
            loadAd('ad-main-container', 'dbdbc33403cb5b88f4914ac88034303b', 320, 50);
            
            // Banners
            loadAd('slot-1', 'af1659d35453444bc57653f2ae403c79', 300, 250);
            loadAd('slot-2', '715b73e0d659246d1b505260e3e38d04', 468, 60);
            loadAd('slot-3', 'f1f0f3268884adc93bd1992609e1e6cb', 160, 300);
            loadAd('slot-4', 'b6e0e3259d3c47f0acad0eb4762f9d0f', 160, 600);
            loadAd('slot-5', '13ac8d74e015acd20a946a4d57f71dd8', 728, 90);

            // Social Bar Stacking
            const s = document.createElement('script');
            s.src = socialBarScript + '?t=' + Date.now();
            document.body.appendChild(s);
        }

        function runCycle() {
            const duration = Math.floor(Math.random() * (60 - 20 + 1)) + 20; 
            const pFill = document.getElementById('p-fill');
            
            pFill.style.transition = 'none';
            pFill.style.width = "0%";
            setTimeout(() => { pFill.style.transition = `width ${duration}s linear`; pFill.style.width = "100%"; }, 50);
            
            refreshAll();
            document.getElementById('status-text').innerText = `🔄 Siklus Aktif: Refresh dlm ${duration}s`;

            setTimeout(() => {
                saldo += 100;
                localStorage.setItem('app_saldo', saldo);
                document.getElementById('saldo').innerText = saldo.toLocaleString('id-ID');
                runCycle();
            }, duration * 1000);
        }

        window.onload = () => {
            document.getElementById('saldo').innerText = saldo.toLocaleString('id-ID');
            runCycle();
        };

        function requestWD() {
            if(saldo < 2000) return alert("Minimal Rp 2.000");
            window.location.href = `https://wa.me/628123456789?text=WD%20Rp${saldo}`;
        }
    </script>
</body>
</html>
