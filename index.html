<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuan Autopilot</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 350px; margin: auto; }
        .balance { background: #2ecc71; color: white; padding: 15px; border-radius: 10px; margin: 20px 0; font-size: 24px; font-weight: bold; }
        button { background: #3498db; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
    <script src="https://pl28601477.effectivegatecpm.com/e4/89/f2/e489f2718cc69f00bc14fdca132e6289.js"></script>
</head>
<body>
    <div class="card">
        <h2>Cuan Autopilot</h2>
        <div class="balance">Rp <span id="saldo">0</span></div>
        <button onclick="tontonVideo()">MULAI MANUAL</button>
        <p style="font-size: 10px; color: gray; margin-top: 20px;">Sistem Otomatis Berjalan Setiap 45 Detik</p>
    </div>

    <script>
        let saldo = parseInt(localStorage.getItem('saldo_user')) || 0;
        document.getElementById('saldo').innerText = saldo.toLocaleString();

        function tontonVideo() {
            // Trik "Force Open" agar aplikasi melempar ke Chrome
            const link = 'https://www.effectivegatecpm.com/sxy78czxp?key=ecbe68cdf04e2a8a22c5f0f6403f198c';
            const a = document.createElement('a');
            a.href = link;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.click();

            saldo += 500;
            localStorage.setItem('saldo_user', saldo);
            document.getElementById('saldo').innerText = saldo.toLocaleString();
        }

        // Jalankan otomatis
        setInterval(tontonVideo, 45000);
    </script>
</body>
</html>
