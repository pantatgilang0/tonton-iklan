<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonton Iklan Dapat Cuan</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #eef2f5; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .sub-title { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        .balance-card { background: #2ecc71; color: white; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .balance-label { font-size: 14px; opacity: 0.9; }
        .balance-amount { font-size: 32px; font-weight: bold; }
        button { background: #3498db; color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 12px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #2980b9; transform: translateY(-2px); }
        .btn-withdraw { background: #95a5a6; }
        .footer { margin-top: 25px; font-size: 11px; color: #bdc3c7; line-height: 1.5; }
    </style>
    <script src="https://pl28601477.effectivegatecpm.com/e4/89/f2/e489f2718cc69f00bc14fdca132e6289.js"></script>
</head>
<body>

    <div class="container">
        <h1>Cuan Autopilot</h1>
        <p class="sub-title">Klik misi untuk menambah saldo!</p>
        
        <div class="balance-card">
            <div class="balance-label">Total Saldo Anda</div>
            <div class="balance-amount">Rp <span id="saldo">0</span></div>
        </div>
        
        <button onclick="tontonVideo()">📺 MISI VIDEO (+Rp 500)</button>
        <button class="btn-withdraw" onclick="tarikSaldo()">💰 TARIK SALDO</button>
        
        <div class="footer">
            Selesaikan misi setiap hari untuk pencairan lebih cepat.<br>
            Server ID: PANTATGILANG0-OFFICIAL
        </div>
    </div>

    <script>
        // Mengambil saldo dari memori HP agar tidak nol lagi saat dibuka kembali
        let saldo = parseInt(localStorage.getItem('saldo_user')) || 0;
        document.getElementById('saldo').innerText = saldo.toLocaleString();

        function tontonVideo() {
            // --- INI KODE IKLAN VIDEO KAMU ---
            window.open('https://www.effectivegatecpm.com/sxy78czxp?key=ecbe68cdf04e2a8a22c5f0f6403f198c', '_blank');

            // --- PROSES TAMBAH SALDO ---
            saldo += 500;
            localStorage.setItem('saldo_user', saldo);
            document.getElementById('saldo').innerText = saldo.toLocaleString();
            
            alert("Misi Video Berhasil! Saldo Rp 500 telah ditambahkan.");
        }

        function tarikSaldo() {
            if (saldo < 100000) {
                alert("Gagal! Minimal penarikan adalah Rp 100.000. Saldo Anda belum cukup.");
            } else {
                alert("Sukses! Permintaan penarikan saldo sedang diproses ke E-Wallet Anda.");
                saldo = 0;
                localStorage.setItem('saldo_user', saldo);
                document.getElementById('saldo').innerText = "0";
            }
        }
    </script>

</body>
</html>
