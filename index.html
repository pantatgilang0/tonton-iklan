<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Billiard Cuan - Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f172a; margin: 0; overflow: hidden; }
        .font-game { font-family: 'Black Ops One', cursive; }
        
        /* Peringatan Putar Layar */
        #orientation-overlay {
            display: none;
            position: fixed; inset: 0; background: #0f172a; z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        @media screen and (orientation: portrait) {
            #orientation-overlay { display: flex; }
        }
    </style>
</head>
<body>

    <div id="orientation-overlay">
        <div class="animate-bounce mb-4">
            <i class="fas fa-mobile-alt text-6xl text-yellow-500" style="transform: rotate(90deg);"></i>
        </div>
        <h2 class="text-2xl font-black text-white px-6 uppercase">Putar HP Kamu!</h2>
        <p class="text-slate-400 mt-2">Gunakan mode Landscape (Tidur) untuk bermain.</p>
    </div>

    <div id="login-screen" class="h-screen flex flex-col justify-center items-center p-6 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-slate-800 to-slate-950">
        <div class="text-center mb-8">
            <i class="fas fa-8-ball text-7xl text-yellow-500 mb-2 drop-shadow-lg"></i>
            <h1 class="text-5xl font-game text-white tracking-tighter uppercase">Billiard <span class="text-yellow-500">Cuan</span></h1>
            <p class="text-slate-400 text-sm mt-2">Login dengan Google untuk Sinkron Teman</p>
        </div>
        
        <button onclick="loginGoogle()" class="bg-white text-slate-900 font-black py-4 px-10 rounded-full flex items-center gap-3 shadow-2xl hover:scale-105 transition-all active:scale-95">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa-lightbox/google.svg" class="w-6" alt="google">
            MASUK DENGAN GOOGLE
        </button>
    </div>

    <div id="main-game" class="h-screen w-full hidden flex p-4 gap-4 bg-slate-950">
        <div class="w-1/3 bg-slate-900 rounded-3xl p-4 border border-slate-800 flex flex-col justify-between shadow-xl">
            <div class="flex items-center gap-3">
                <img id="user-photo" src="" class="w-12 h-12 rounded-full border-2 border-yellow-500 bg-slate-800">
                <div class="overflow-hidden">
                    <p id="user-name" class="font-black text-sm truncate uppercase text-white">Player</p>
                    <p id="user-id" class="text-[10px] text-yellow-500 font-mono font-bold">ID: --</p>
                </div>
            </div>
            <div class="space-y-2">
                <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700">
                    <p class="text-[9px] text-slate-500 font-bold uppercase">Saldo Anda</p>
                    <p id="user-balance" class="text-xl font-black text-green-400">Rp 0</p>
                </div>
                <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700">
                    <p class="text-[9px] text-slate-500 font-bold uppercase">Win Streak</p>
                    <p id="user-wins" class="text-xl font-black text-blue-400">0</p>
                </div>
            </div>
            <button onclick="logout()" class="text-[10px] text-slate-600 font-bold hover:text-red-500 transition-colors uppercase italic">Logout</button>
        </div>

        <div class="w-2/3 bg-slate-900 rounded-3xl p-6 border border-slate-800 flex flex-col justify-center relative">
            <h2 class="text-yellow-500 font-black mb-6 flex items-center gap-2 text-xl uppercase italic">
                <i class="fas fa-crosshairs text-red-500"></i> Battle Arena
            </h2>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <input id="target-id" type="text" placeholder="ID LAWAN" class="w-full bg-slate-950 border border-slate-700 p-4 rounded-2xl outline-none focus:border-yellow-500 font-mono text-center text-lg text-white">
                <input id="bet-val" type="number" placeholder="TARUHAN (RP)" class="w-full bg-slate-950 border border-slate-700 p-4 rounded-2xl outline-none focus:border-green-500 font-black text-center text-lg text-green-400">
            </div>
            <button onclick="claimWin()" class="bg-yellow-500 text-slate-950 font-black py-5 rounded-2xl shadow-lg shadow-yellow-500/20 active:scale-95 transition-all text-2xl uppercase italic">
                SAYA MENANG!
            </button>
        </div>
    </div>

    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 px-8 py-3 rounded-full text-sm font-black shadow-2xl hidden z-[10000]"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, get, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIG FIREBASE KAMU (DARI SCREENSHOT)
        const firebaseConfig = {
            apiKey: "AIzaSyBtWXJHlpUoIoQL7EoBJabgD95KP1kXCWM",
            authDomain: "biliardcuan.firebaseapp.com",
            databaseURL: "https://biliardcuan-default-rtdb.firebaseio.com",
            projectId: "biliardcuan",
            storageBucket: "biliardcuan.firebasestorage.app",
            messagingSenderId: "99704420851",
            appId: "1:99704420851:web:d3c21eaea48313c0a07a86"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        window.loginGoogle = () => {
            signInWithPopup(auth, provider).catch(err => {
                alert("Gagal Login. Pastikan domain sudah ditambahkan di Firebase Authorized Domains.");
            });
        };

        window.logout = () => { if(confirm("Keluar?")) signOut(auth).then(() => location.reload()); };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-game').classList.replace('hidden', 'flex');

                const myUid = "ID-" + user.uid.substring(0, 4).toUpperCase();
                const userRef = ref(db, 'players/' + myUid);
                
                const snap = await get(userRef);
                if (!snap.exists()) {
                    await set(userRef, { uid: myUid, name: user.displayName, photo: user.photoURL, balance: 100000, wins: 0 });
                }

                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-photo').src = user.photoURL;
                document.getElementById('user-id').innerText = "ID: " + myUid;

                onValue(userRef, (s) => {
                    const d = s.val();
                    if(d) {
                        document.getElementById('user-balance').innerText = "Rp " + d.balance.toLocaleString();
                        document.getElementById('user-wins').innerText = d.wins;
                    }
                });
            }
        });

        window.claimWin = async () => {
            const oppId = document.getElementById('target-id').value.trim().toUpperCase();
            const bet = parseInt(document.getElementById('bet-val').value);
            const myUid = "ID-" + auth.currentUser.uid.substring(0, 4).toUpperCase();

            if (!oppId || isNaN(bet) || bet <= 0) return showToast("DATA TIDAK VALID!", "bg-red-600");
            
            const oppRef = ref(db, 'players/' + oppId);
            const oppSnap = await get(oppRef);

            if (!oppSnap.exists()) return showToast("ID LAWAN TIDAK ADA!", "bg-red-600");
            
            const oppData = oppSnap.val();
            if (oppData.balance < bet) return showToast("SALDO LAWAN KURANG!", "bg-orange-600");

            await update(oppRef, { balance: oppData.balance - bet });
            const myRef = ref(db, 'players/' + myUid);
            const mySnap = await get(myRef);
            await update(myRef, { balance: mySnap.val().balance + bet, wins: mySnap.val().wins + 1 });

            showToast("MENANG! SALDO BERTAMBAH.", "bg-green-600");
            document.getElementById('target-id').value = "";
            document.getElementById('bet-val').value = "";
        };

        function showToast(txt, cls) {
            const t = document.getElementById('toast');
            t.innerText = txt;
            t.className = `fixed top-6 left-1/2 -translate-x-1/2 px-8 py-3 rounded-full text-sm font-black shadow-2xl block text-white ${cls}`;
            setTimeout(() => t.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
